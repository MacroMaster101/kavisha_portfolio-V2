name: Refresh social previews

# Keeps src/data/socialPreviews.ts in sync with the social-preview images and
# release metadata of your GitHub repos. Runs the generator on a schedule (and on
# demand) and commits the result to `dev` only when it actually changes. `main` is
# protected (PRs from dev only), so the `release` job then opens a dev → main pull
# request, waits for the required checks and merges it — but only while that file
# is the sole difference between the branches. Unreleased work on dev is never
# shipped from here; the refreshed data then waits for your next manual release.

on:
  schedule:
    # Daily at 06:00 UTC. Adjust the cron if you want a different cadence.
    - cron: '0 6 * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: read

concurrency:
  group: social-previews
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push the updated file back to dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          # Push with the personal access token: a push made with the built-in
          # GITHUB_TOKEN leaves the open release PR's checks stuck at "action
          # required", so the release job would time out waiting for them.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Regenerate social previews
        env:
          # Built-in token — raises the GitHub API rate limit. No setup required.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-social-previews.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/socialPreviews.ts; then
            echo "No social-preview changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/socialPreviews.ts
          git commit -m "chore: refresh social previews"
          git push origin HEAD:dev

  release:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Fine-grained personal access token (Contents + Pull requests: read/write on
      # this repo). Pull requests opened with the built-in GITHUB_TOKEN do not
      # trigger workflows, so main's required checks would never run on them.
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0

      - name: Check what dev would release
        id: scope
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main HEAD)"
          if [ -z "$changed" ]; then
            echo "dev matches main; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "$changed" != "src/data/socialPreviews.ts" ]; then
            echo "dev holds other unreleased changes; leaving the release to a manual pull request:"
            echo "$changed"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the release pull request
        if: steps.scope.outputs.release == 'true'
        id: pr
        run: |
          number="$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            gh pr create --base main --head dev \
              --title "Release: refresh social previews" \
              --body "Automated release of refreshed repository previews and release metadata (src/data/socialPreviews.ts only)."
            number="$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Wait for the required checks
        if: steps.scope.outputs.release == 'true'
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          for attempt in $(seq 1 60); do
            sleep 15
            failed="$(gh pr checks "$NUMBER" --required --json name,bucket \
              --jq '[.[] | select(.bucket == "fail" or .bucket == "cancel") | .name] | join(", ")' 2>/dev/null || true)"
            if [ -n "$failed" ]; then
              echo "::error::Required checks failed: $failed."
              exit 1
            fi
            state="$(gh pr view "$NUMBER" --json mergeStateStatus --jq '.mergeStateStatus')"
            echo "merge state: $state"
            case "$state" in
              CLEAN | UNSTABLE | HAS_HOOKS) exit 0 ;;
            esac
          done
          echo "::error::Timed out waiting for the required checks."
          exit 1

      - name: Merge into main
        if: steps.scope.outputs.release == 'true'
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.scope.outputs.sha }}
        run: gh pr merge "$NUMBER" --merge --match-head-commit "$SHA"
