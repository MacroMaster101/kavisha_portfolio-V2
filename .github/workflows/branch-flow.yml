name: Branch flow

# Enforces feature → dev → main: pull requests into main must come from dev.
# The `source-branch` job is a required status check in the main ruleset.

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Pull requests into main must come from this repository's dev branch (got $HEAD_REPO:$HEAD_REF)."
            exit 1
          fi
          echo "Source branch is dev."
