      try {
        const saved = localStorage.getItem('theme');
        document.documentElement.classList.add(
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        );
      } catch {
        document.documentElement.classList.add(
          matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
